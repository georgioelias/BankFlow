name: banking_app
description: A modern mobile banking application built with Flutter and Supabase.

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  
  # State Management
  provider: ^6.1.2
  
  # Backend & Auth
  supabase_flutter: ^2.8.4
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  
  # Charts for Statistics
  fl_chart: ^0.69.2
  
  # Loading indicators
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
